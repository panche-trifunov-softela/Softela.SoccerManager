parent=base
locales=en

styles=css/login.css

# Keycloak's class hooks, mapped onto this theme's own class names. Pages we do
# not override - reset password, update password, OTP, error - inherit them.
kcHtmlClass=login-html
kcBodyClass=login-body
kcLoginClass=auth
kcFormCardClass=auth_card
kcFormHeaderClass=auth_header
kcContentWrapperClass=auth_content
kcFormClass=auth_form
kcFormGroupClass=field-group
kcLabelClass=field_label
kcInputClass=field
kcInputGroup=field-wrapper
kcInputErrorMessageClass=field_error
kcFormSettingClass=auth_options
kcFormOptionsWrapperClass=auth_options_reset
kcButtonClass=btn btn--sm
kcButtonPrimaryClass=btn--primary
kcButtonBlockClass=w-100
kcButtonLargeClass=
kcAlertClass=alert
kcAlertTitleClass=alert_title
kcSignUpClass=auth_info
kcHeaderClass=auth_realm
kcHeaderWrapperClass=auth_realm_name
kcFormPasswordVisibilityButtonClass=field-btn
kcFormPasswordVisibilityIconShow=icon-eye
kcFormPasswordVisibilityIconHide=icon-eye-slash
