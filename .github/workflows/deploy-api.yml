name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'SoccerManager.API/**'
      - 'SoccerManager.Application/**'
      - 'SoccerManager.Domain/**'
      - 'SoccerManager.Infrastructure/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# A second push waits for the running deploy instead of racing it.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  RESOURCE_GROUP: soccerteambuilder
  REGISTRY: soccermanageracr
  APP: soccermanager-api
  IMAGE_TAG: soccermanager-api:${{ github.sha }}
  HEALTH_URL: https://api.the11master.com/health

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # OpenID Connect: the workflow's GitHub token is exchanged for the
      # soccermanager-github identity, so no Azure secret is stored here.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build the image in the registry
        run: az acr build --registry "$REGISTRY" --resource-group "$RESOURCE_GROUP" --image "$IMAGE_TAG" --file Dockerfile .

      - name: Roll out the new image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update --name "$APP" --resource-group "$RESOURCE_GROUP" --image "$REGISTRY.azurecr.io/$IMAGE_TAG"

      # The previous revision keeps serving until the new one passes its probes.
      - name: Wait for the new revision
        run: |
          for attempt in $(seq 1 60); do
            latest=$(az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" --query properties.latestRevisionName --output tsv)
            ready=$(az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" --query properties.latestReadyRevisionName --output tsv)
            if [ "$latest" = "$ready" ]; then
              echo "Revision $ready is ready."
              exit 0
            fi
            sleep 10
          done
          echo "Revision $latest did not become ready." >&2
          az containerapp revision list --name "$APP" --resource-group "$RESOURCE_GROUP" --output table
          exit 1

      - name: Check health
        run: curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$HEALTH_URL"
